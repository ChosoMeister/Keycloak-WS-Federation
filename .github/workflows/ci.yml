name: CI

on:
  push:
    branches: [main, "migration/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify provider contents
        run: |
          jar tf keycloak-wsfed/target/keycloak-wsfed-26.7.0-SNAPSHOT.jar > jar-contents.txt
          grep -q 'META-INF/services/org.keycloak.protocol.LoginProtocolFactory' jar-contents.txt
          grep -q 'io/github/chosomeister/keycloak/protocol/wsfed/WSFedLoginProtocol.class' jar-contents.txt
          ! grep -q '^theme/' jar-contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keycloak-wsfed
          path: keycloak-wsfed/target/keycloak-wsfed-*.jar
          if-no-files-found: error
