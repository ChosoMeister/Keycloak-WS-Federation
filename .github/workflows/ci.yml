name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify provider contents
        run: |
          jar tf keycloak-wsfed/target/keycloak-wsfed-26.7.0-SNAPSHOT.jar > jar-contents.txt
          grep -q 'META-INF/services/org.keycloak.protocol.LoginProtocolFactory' jar-contents.txt
          grep -q 'io/github/chosomeister/keycloak/protocol/wsfed/WSFedLoginProtocol.class' jar-contents.txt
          ! grep -q '^theme/' jar-contents.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keycloak-wsfed
          path: keycloak-wsfed/target/keycloak-wsfed-*.jar
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate examples and scripts
        run: |
          jq --exit-status . examples/realm-wsfed-idp.json >/dev/null
          bash -n scripts/*.sh keycloak-wsfed/install.sh
          docker compose config --quiet
      - name: Build and start the example stack
        run: docker compose up --detach --build
      - name: Run WS-Federation smoke test
        run: |
          ./scripts/smoke-test.sh
          ./scripts/integration-test.sh
      - name: Show server logs on failure
        if: failure()
        run: docker compose logs keycloak
      - name: Stop the example stack
        if: always()
        run: docker compose down --volumes
